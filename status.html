<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenchats - Status</title>
<style>
  :root{
    --bg:#0B0D12; --surface:#161A22; --surface-2:#1E232D;
    --accent:#6C5CE7; --accent-warm:#F2B84B; --text:#ECEDEF; --muted:#8B939F; --danger:#FF6B6B;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
  .app{ display:flex; flex-direction:column; height:100vh; }

  header{ padding:18px; border-bottom:1px solid rgba(255,255,255,0.06); }
  header h1{ font-size:1.2rem; }
  header h1 span{ color:var(--accent-warm); }

  .content{ flex:1; overflow-y:auto; padding:16px; }

  .add-status-btn{
    width:100%; padding:13px; border-radius:14px; border:1.5px dashed rgba(255,255,255,0.2);
    background:var(--surface); color:var(--accent-warm); font-size:0.9rem; font-weight:600;
    cursor:pointer; margin-bottom:18px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .add-status-btn:hover{ background:var(--surface-2); }

  .section-label{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
  .empty-hint{ text-align:center; color:var(--muted); font-size:0.85rem; margin-top:40px; padding:0 20px; line-height:1.5; }

  .status-row{
    display:flex; align-items:center; gap:12px;
    padding:10px; margin-bottom:8px; border-radius:14px; cursor:pointer;
    background:var(--surface); border:1px solid rgba(255,255,255,0.05);
  }
  .status-row:hover{ background:var(--surface-2); }
  .swatch{
    width:50px; height:50px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:0.68rem; color:rgba(255,255,255,0.9); font-weight:600;
    padding:6px; text-align:center; overflow:hidden; line-height:1.2;
  }
  .s-info{ flex:1; min-width:0; }
  .s-name{ font-weight:600; font-size:0.92rem; }
  .s-time{ font-size:0.76rem; color:var(--muted); margin-top:2px; }
  .s-delete{ background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; padding:6px; }
  .s-delete:hover{ color:var(--danger); }

  nav.bottomnav{ display:flex; border-top:1px solid rgba(255,255,255,0.06); background:var(--surface); }
  nav.bottomnav a{ position:relative; flex:1; text-align:center; padding:12px 0; color:var(--muted); text-decoration:none; font-size:0.78rem; }
  nav.bottomnav a.active{ color:var(--accent-warm); }
  nav.bottomnav .ic{ font-size:1.2rem; display:block; margin-bottom:2px; position:relative; }
  .nav-dot{
    position:absolute; top:-2px; right:calc(50% - 15px);
    width:9px; height:9px; border-radius:50%; background:#FF6B6B;
    border:2px solid var(--bg); display:none;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.65);
    display:none; align-items:center; justify-content:center; z-index:30; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .compose-box{ width:100%; max-width:340px; border-radius:20px; overflow:hidden; }
  .compose-canvas{
    height:300px; display:flex; align-items:center; justify-content:center;
    padding:24px; transition:background 0.2s ease;
  }
  .compose-canvas textarea{
    width:100%; background:transparent; border:none; outline:none; resize:none;
    color:#fff; font-size:1.3rem; font-weight:600; text-align:center; font-family:inherit;
  }
  .compose-canvas textarea::placeholder{ color:rgba(255,255,255,0.6); }
  .compose-footer{ background:var(--surface); padding:16px; }
  .color-row{ display:flex; gap:10px; justify-content:center; margin-bottom:14px; }
  .color-dot{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .color-dot.active{ border-color:#fff; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1; padding:11px; border-radius:10px; border:none; font-size:0.9rem; font-weight:600; cursor:pointer;
  }
  .btn-cancel{ background:var(--surface-2); color:var(--text); }
  .btn-post{ background:var(--accent); color:#fff; }
  .btn-post:disabled{ opacity:0.6; }

  .viewer-overlay{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center;
  }
  .viewer-overlay.show{ display:flex; }
  .viewer-box{
    width:100%; max-width:360px; height:70vh; max-height:520px;
    border-radius:20px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:30px; position:relative;
  }
  .viewer-close{
    position:absolute; top:14px; right:14px;
    background:rgba(0,0,0,0.3); border:none; color:#fff;
    width:32px; height:32px; border-radius:50%; font-size:1.1rem; cursor:pointer;
  }
  .viewer-who{
    position:absolute; top:16px; left:16px;
    color:#fff; font-size:0.85rem; font-weight:600;
    background:rgba(0,0,0,0.3); padding:6px 12px; border-radius:999px;
  }
  .viewer-text{
    color:#fff; font-size:1.5rem; font-weight:700; text-align:center; line-height:1.4;
    word-wrap:break-word;
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>Status<span>.</span></h1></header>

  <div class="content">
    <button class="add-status-btn" id="openComposeBtn">+ Tambah Status</button>
    <div class="section-label">Status Aktif (24 jam terakhir)</div>
    <div id="statusList">
      <div class="empty-hint">Belum ada status. Jadi yang pertama!</div>
    </div>
  </div>

  <nav class="bottomnav">
    <a href="chat.html"><span class="ic">💬<span class="nav-dot" id="dotChat"></span></span>Chat</a>
    <a href="status.html" class="active"><span class="ic">✨</span>Status</a>
    <a href="profile.html"><span class="ic">👤</span>Profil</a>
  </nav>
</div>

<div class="modal-overlay" id="composeModal">
  <div class="compose-box">
    <div class="compose-canvas" id="composeCanvas" style="background:#6C5CE7;">
      <textarea id="statusText" placeholder="Tulis status kamu..." maxlength="150" rows="4"></textarea>
    </div>
    <div class="compose-footer">
      <div class="color-row" id="colorRow"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelComposeBtn">Batal</button>
        <button class="btn-post" id="postStatusBtn">Posting</button>
      </div>
    </div>
  </div>
</div>

<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-box" id="viewerBox">
    <button class="viewer-close" id="viewerCloseBtn">✕</button>
    <div class="viewer-who" id="viewerWho">User</div>
    <div class="viewer-text" id="viewerText"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app-check.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, query, where, orderBy,
    onSnapshot, addDoc, deleteDoc, serverTimestamp, Timestamp, updateDoc
  } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJomifys1cY-9ELI4Ft3Z5N-cLs2YQcVU",
    authDomain: "nero-fa67c.firebaseapp.com",
    projectId: "nero-fa67c",
    storageBucket: "nero-fa67c.firebasestorage.app",
    messagingSenderId: "349005489687",
    appId: "1:349005489687:web:c27ce076b4f54da5275e52"
  };
  const app = initializeApp(firebaseConfig);
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6Ld4soYtAAAAADmH1LCV9d9y3-bfxsexYxuOlVdP'),
    isTokenAutoRefreshEnabled: true
  });
  const auth = getAuth(app);
  const db = getFirestore(app);

  function fmtAgo(ts){
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
    if (diffMin < 1) return 'baru saja';
    if (diffMin < 60) return diffMin + ' menit lalu';
    const diffH = Math.floor(diffMin / 60);
    return diffH + ' jam lalu';
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function startPresence(myUid){
    const ref = doc(db, 'users', myUid);
    const beat = () => updateDoc(ref, { lastSeen: serverTimestamp() }).catch(()=>{});
    beat();
    setInterval(beat, 25000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
    window.addEventListener('beforeunload', beat);
  }

  const COLORS = ['#6C5CE7', '#F2B84B', '#FF6B6B', '#5FD68D', '#4A90D9', '#E85AAD'];
  let selectedColor = COLORS[0];
  let myUid = null;
  let myUsername = '';

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'portal-x9k3f.html'; return; }
    myUid = user.uid;
    const snap = await getDoc(doc(db, 'users', myUid));
    if (snap.exists() && snap.data().banned === true){
      await signOut(auth);
      alert('Akun ini telah dibanned dari Kenchats.');
      window.location.href = 'portal-x9k3f.html';
      return;
    }
    myUsername = snap.exists() ? snap.data().username : (user.email || 'User');
    startPresence(myUid);
    watchUnreadBadge();
    watchStatuses();
  });

  function watchUnreadBadge(){
    const dot = document.getElementById('dotChat');
    const q = query(collection(db, 'chats'), where('participants', 'array-contains', myUid));
    onSnapshot(q, (snap) => {
      let unread = false;
      snap.forEach(d => {
        const c = d.data();
        if (!c.lastMessage || c.lastSenderId === myUid) return;
        const lastRead = c.lastRead && c.lastRead[myUid] ? c.lastRead[myUid].toMillis() : 0;
        const updated = c.updatedAt && c.updatedAt.toMillis ? c.updatedAt.toMillis() : 0;
        if (updated > lastRead) unread = true;
      });
      dot.style.display = unread ? 'block' : 'none';
    });
  }

  const colorRow = document.getElementById('colorRow');
  const canvas = document.getElementById('composeCanvas');
  COLORS.forEach((c, i) => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (i === 0 ? ' active' : '');
    dot.style.background = c;
    dot.addEventListener('click', () => {
      selectedColor = c;
      canvas.style.background = c;
      document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
      dot.classList.add('active');
    });
    colorRow.appendChild(dot);
  });

  const composeModal = document.getElementById('composeModal');
  const statusTextEl = document.getElementById('statusText');

  document.getElementById('openComposeBtn').addEventListener('click', () => {
    statusTextEl.value = '';
    selectedColor = COLORS[0];
    canvas.style.background = selectedColor;
    document.querySelectorAll('.color-dot').forEach((el,i) => el.classList.toggle('active', i===0));
    composeModal.classList.add('show');
  });

  document.getElementById('cancelComposeBtn').addEventListener('click', () => {
    composeModal.classList.remove('show');
  });

  document.getElementById('postStatusBtn').addEventListener('click', async () => {
    const text = statusTextEl.value.trim();
    if (!text) return;
    const btn = document.getElementById('postStatusBtn');
    btn.disabled = true;
    btn.textContent = 'Posting...';

    try {
      await addDoc(collection(db, 'statuses'), {
        uid: myUid, username: myUsername, text: text, color: selectedColor, createdAt: serverTimestamp()
      });
      composeModal.classList.remove('show');
    } catch (err) {
      alert('Gagal posting: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Posting';
    }
  });

  function watchStatuses(){
    const dayAgo = Timestamp.fromMillis(Date.now() - 24 * 60 * 60 * 1000);
    const q = query(collection(db, 'statuses'), where('createdAt', '>', dayAgo), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snap) => {
      const listEl = document.getElementById('statusList');
      if (snap.empty){
        listEl.innerHTML = '<div class="empty-hint">Belum ada status. Jadi yang pertama!</div>';
        return;
      }
      listEl.innerHTML = '';
      snap.forEach(d => {
        const s = d.data();
        const row = document.createElement('div');
        row.className = 'status-row';
        const isMine = s.uid === myUid;
        row.innerHTML = `
          <div class="swatch" style="background:${s.color || '#6C5CE7'}">${escapeHtml(s.text).slice(0,40)}</div>
          <div class="s-info">
            <div class="s-name">${isMine ? 'Kamu' : escapeHtml(s.username || 'User')}</div>
            <div class="s-time">${fmtAgo(s.createdAt)}</div>
          </div>
          ${isMine ? '<button class="s-delete" title="Hapus">🗑</button>' : ''}
        `;
        row.addEventListener('click', (e) => {
          if (e.target.closest('.s-delete')) return;
          openViewer(s, isMine);
        });
        if (isMine){
          row.querySelector('.s-delete').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm('Hapus status ini?')){
              await deleteDoc(doc(db, 'statuses', d.id));
            }
          });
        }
        listEl.appendChild(row);
      });
    });
  }

  const viewerOverlay = document.getElementById('viewerOverlay');
  const viewerBox = document.getElementById('viewerBox');

  function openViewer(s, isMine){
    viewerBox.style.background = s.color || '#6C5CE7';
    document.getElementById('viewerWho').textContent = isMine ? 'Kamu' : (s.username || 'User');
    document.getElementById('viewerText').textContent = s.text;
    viewerOverlay.classList.add('show');
  }

  document.getElementById('viewerCloseBtn').addEventListener('click', () => {
    viewerOverlay.classList.remove('show');
  });
  viewerOverlay.addEventListener('click', (e) => {
    if (e.target === viewerOverlay) viewerOverlay.classList.remove('show');
  });
</script>
</body>
</html>
