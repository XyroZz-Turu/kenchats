<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenchats - Admin</title>
<style>
  :root{
    --bg:#0B0D12; --surface:#161A22; --surface-2:#1E232D;
    --accent:#6C5CE7; --accent-warm:#F2B84B; --text:#ECEDEF; --muted:#8B939F; --danger:#FF6B6B;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ min-height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
  .app{ max-width:600px; margin:0 auto; padding:18px; }
  header h1{ font-size:1.3rem; margin-bottom:4px; }
  header h1 span{ color:var(--accent-warm); }
  header p{ color:var(--muted); font-size:0.82rem; margin-bottom:20px; }

  .state-box{ text-align:center; color:var(--muted); font-size:0.9rem; margin-top:60px; padding:0 20px; line-height:1.6; }

  .report-card{
    background:var(--surface); border:1px solid rgba(255,255,255,0.06);
    border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .report-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .report-time{ font-size:0.75rem; color:var(--muted); }
  .report-row{ display:flex; gap:8px; font-size:0.88rem; margin-bottom:6px; }
  .report-row .lbl{ color:var(--muted); min-width:90px; flex-shrink:0; }
  .report-reason{
    background:var(--surface-2); border-radius:8px; padding:10px 12px;
    font-size:0.85rem; margin-top:8px; color:var(--text);
  }
  .del-btn{
    padding:6px 14px; border-radius:999px; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font-size:0.78rem; cursor:pointer;
  }
  .del-btn:hover{ background:rgba(255,107,107,0.1); }

  .refresh-btn{
    padding:8px 16px; border-radius:999px; border:1px solid rgba(255,255,255,0.15);
    background:var(--surface); color:var(--text); font-size:0.82rem; cursor:pointer; margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Admin<span>.</span></h1>
    <p>Daftar laporan (report) dari user</p>
  </header>

  <div id="content">
    <div class="state-box">Memuat...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, query, orderBy, getDocs, deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJomifys1cY-9ELI4Ft3Z5N-cLs2YQcVU",
    authDomain: "nero-fa67c.firebaseapp.com",
    projectId: "nero-fa67c",
    storageBucket: "nero-fa67c.firebasestorage.app",
    messagingSenderId: "349005489687",
    appId: "1:349005489687:web:c27ce076b4f54da5275e52"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const contentEl = document.getElementById('content');

  function fmtDate(ts){
    if (!ts) return '-';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      contentEl.innerHTML = '<div class="state-box">Kamu harus login dulu.<br><a href="login.html" style="color:#F2B84B;">Ke halaman Login</a></div>';
      return;
    }

    const mySnap = await getDoc(doc(db, 'users', user.uid));
    const isAdmin = mySnap.exists() && mySnap.data().isAdmin === true;

    if (!isAdmin) {
      contentEl.innerHTML = '<div class="state-box">Akses ditolak. Halaman ini cuma buat admin.</div>';
      return;
    }

    loadReports();
  });

  async function loadReports(){
    contentEl.innerHTML = '<button class="refresh-btn" id="refreshBtn">🔄 Refresh</button><div id="reportList"><div class="state-box">Memuat laporan...</div></div>';
    document.getElementById('refreshBtn').addEventListener('click', loadReports);

    try {
      const q = query(collection(db, 'reports'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      const listEl = document.getElementById('reportList');

      if (snap.empty){
        listEl.innerHTML = '<div class="state-box">Belum ada laporan masuk.</div>';
        return;
      }

      listEl.innerHTML = '';
      for (const d of snap.docs){
        const r = d.data();
        const [reporterSnap, reportedSnap] = await Promise.all([
          r.reporterUid ? getDoc(doc(db, 'users', r.reporterUid)) : null,
          r.reportedUid ? getDoc(doc(db, 'users', r.reportedUid)) : null
        ]);
        const reporterName = reporterSnap && reporterSnap.exists() ? reporterSnap.data().username : '(tidak ditemukan)';
        const reportedName = reportedSnap && reportedSnap.exists() ? reportedSnap.data().username : '(tidak ditemukan)';

        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div class="report-top">
            <span class="report-time">${fmtDate(r.createdAt)}</span>
            <button class="del-btn">Hapus</button>
          </div>
          <div class="report-row"><span class="lbl">Pelapor</span><span>${escapeHtml(reporterName)}</span></div>
          <div class="report-row"><span class="lbl">Dilaporkan</span><span>${escapeHtml(reportedName)}</span></div>
          ${r.reason ? `<div class="report-reason">"${escapeHtml(r.reason)}"</div>` : ''}
        `;
        card.querySelector('.del-btn').addEventListener('click', async () => {
          if (!confirm('Hapus laporan ini?')) return;
          await deleteDoc(d.ref);
          card.remove();
        });
        listEl.appendChild(card);
      }
    } catch(err){
      document.getElementById('reportList').innerHTML = `<div class="state-box">Gagal memuat: ${err.message}</div>`;
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
</script>
</body>
</html>
